# Local-only Supabase CLI configuration. No remote project is linked by this file.
project_id = "paidflow-local"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
# Demo seed is opt-in: see docs/database-testing.md. Never enable for production.
enabled = false
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = true
